repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^INDEX\.md$
      - id: trailing-whitespace
        exclude: ^INDEX\.md$

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        # To keep outputs for a showcase entry, add it here, e.g.:
        # exclude: ^entries/2026/2026-10-14_agu-workshop/
