name: Docs

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "docs/**"
      - "scripts/build_index.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "entries/**"
      - "docs/**"
      - "scripts/build_index.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Cancel superseded PR builds, but never interrupt a Pages deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # Notebooks aren't executed (nb_execution_mode = "off"), so no data or
      # UXarray install is needed; this only renders committed outputs.
      - run: sphinx-build -b html --keep-going docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
